<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành màu nền và ảnh nền CSS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. Tiêu đề h1 -->
    <h1>Chào mừng đến với trang web của tôi</h1>

    <!-- 2. Đoạn văn p mô tả trang web -->
    <p class="description">
        Đây là trang web thực hành sử dụng màu nền (background-color) và ảnh nền (background-image) trong CSS.
    </p>

    <!-- 3. Khối div chứa nội dung quan trọng -->
    <div class="important-box">
        <h2>Nội dung quan trọng</h2>
        <p>Khối này được thiết lập ảnh nền và căn giữa nội dung.</p>
    </div>

</body>
</html>
